name: Build

on:
  push:
    branches:
      - main
      - "improve/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Check packaged JAR and create checksum
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name 'TrimCraft-*.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TrimCraft-JAR
          path: |
            target/TrimCraft-*.jar
            target/TrimCraft-*.jar.sha256
          if-no-files-found: error
          retention-days: 14
