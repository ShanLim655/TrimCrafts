# ============================================================
#   TrimCraft Configuration - Minecraft 1.21+ Armor Trim Plugin
#   Author: TrimCraft Team
#============================================================

# General settings
general:
  # Prefix shown in chat messages
  prefix: "&8[&6TrimCraft&8] &r"
  # Language for messages (en)
  language: "en"
  # Whether to show ability descriptions in chat when equipping armor
  show-equip-messages: true
  # Whether to display cooldown above XP bar (action bar)
  show-cooldown-bar: true
  # Show trim HUD (scoreboard sidebar) when wearing a full trim set
  show-hud: true
  # Apply custom lore to trim smithing template items
  apply-trim-lore: true
  # Update checker (disable if no internet)
  check-updates: true

# ── DATABASE ─────────────────────────────────────────────────
# Choose 'sqlite' (default, no setup needed) or 'mysql'
database:
  type: sqlite
  sqlite:
    file: trimcraft.db
  mysql:
    host: localhost
    port: 3306
    database: trimcraft
    username: root
    password: password

# ── SCOREBOARD HUD ───────────────────────────────────────────
# Shown on the sidebar when wearing a full matching trim set
hud:
  enabled: true
  show-ability-names: true
  show-keybinds: true
  show-descriptions: true
  show-separator: true

# ── EQUIP TITLE ──────────────────────────────────────────────
# Title shown on screen when you equip a full trim set
equip-title:
  enabled: true
  fade-in: 10    # ticks
  stay: 50       # ticks
  fade-out: 15   # ticks

# Cooldown settings (in seconds)
cooldowns:
  # ── SILENCE TRIM ──────────────────────────────────────────
  silence-life-force-suction: 30
  silence-silence-ability: 45

  # ── WILD TRIM ─────────────────────────────────────────────
  wild-nature-bond: 20
  wild-beast-rage: 35

  # ── COAST TRIM ────────────────────────────────────────────
  coast-tidal-wave: 25
  coast-sea-shield: 40

  # ── DUNE TRIM ─────────────────────────────────────────────
  dune-sandstorm: 30
  dune-mirages: 50

  # ── EYE TRIM ──────────────────────────────────────────────
  eye-divine-sight: 25
  eye-curse-of-sight: 40

  # ── HOST TRIM ─────────────────────────────────────────────
  host-spectral-anchor: 35
  host-undying-will: 60

  # ── RAISER TRIM ───────────────────────────────────────────
  raiser-raise-dead: 45
  raiser-death-mark: 30

  # ── SENTRY TRIM ───────────────────────────────────────────
  sentry-iron-wall: 20
  sentry-execute: 60

  # ── SHAPER TRIM ───────────────────────────────────────────
  shaper-warp: 15
  shaper-gravity-crush: 40

  # ── SNOUT TRIM ────────────────────────────────────────────
  snout-brute-charge: 20
  snout-war-cry: 45

  # ── SPIRE TRIM ────────────────────────────────────────────
  spire-inferno-strike: 25
  spire-fire-shield: 40

  # ── TIDE TRIM ─────────────────────────────────────────────
  tide-tsunami: 30
  tide-abyssal-form: 50

  # ── VEX TRIM ──────────────────────────────────────────────
  vex-phantom-dash: 10
  vex-ethereal-blade: 35

  # ── WARD TRIM ─────────────────────────────────────────────
  ward-reflect: 20
  ward-sanctuary: 55

  # ── WAYFINDER TRIM ────────────────────────────────────────
  wayfinder-phase-step: 12
  wayfinder-cartographers-curse: 50

  # ── BOLT TRIM ─────────────────────────────────────────────
  bolt-lightning-strike: 15
  bolt-storm-armor: 45

  # ── FLOW TRIM ─────────────────────────────────────────────
  flow-time-warp: 40
  flow-temporal-shield: 55

# ── SILENCE TRIM ────────────────────────────────────────────
silence:
  enabled: true
  # Prevent players from duplicating the Silence Armor Trim at a crafting table
  anti-dupe: true
  # Life Force Suction (Shift + Left Click)
  life-force-suction:
    duration-ticks: 80  # 4 seconds = 80 ticks
    drain-per-tick: 0.5  # HP drained per tick
    # Multiplier based on armor material
    multipliers:
      leather: 0.6
      chainmail: 0.7
      iron: 0.8
      gold: 0.75
      diamond: 1.0
      netherite: 1.4
    require-full-set: true
    particle-color:
      r: 150
      g: 0
      b: 200
  # Silence (Shift + Right Click)
  silence-ability:
    blindness-duration: 300   # ticks (15s)
    slowness-duration: 200    # ticks (10s)
    slowness-amplifier: 2     # Slowness III = amplifier 2
    nausea-duration: 100      # ticks (5s)
    weakness-duration: 200    # ticks (10s)
    range: 10.0
    require-full-set: true

# ── WILD TRIM ───────────────────────────────────────────────
wild:
  enabled: true
  nature-bond:
    healing-per-second: 1.5
    duration-ticks: 100  # 5 seconds
    speed-amplifier: 1
    require-full-set: false
    particle-color:
      r: 0
      g: 200
      b: 50
  beast-rage:
    strength-amplifier: 2
    speed-amplifier: 1
    duration-ticks: 120  # 6 seconds
    damage-boost: 3.0
    require-full-set: false

# ── COAST TRIM ──────────────────────────────────────────────
coast:
  enabled: true
  tidal-wave:
    radius: 8.0
    knockback-power: 2.5
    slowness-duration: 60
    require-full-set: false
  sea-shield:
    absorption-hearts: 4
    duration-ticks: 100
    water-breathing-duration: 200
    require-full-set: true

# ── DUNE TRIM ───────────────────────────────────────────────
dune:
  enabled: true
  sandstorm:
    radius: 6.0
    blindness-duration: 60
    slowness-duration: 80
    damage: 2.0
    require-full-set: false
  mirages:
    decoy-count: 3
    decoy-duration-ticks: 80
    require-full-set: true

# ── EYE TRIM ────────────────────────────────────────────────
eye:
  enabled: true
